plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = "${mod_version}"
group = 'com.elowen'
base {
    archivesName = "${mod_id}-nextgen"
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    // Identity ("no-op") mappings used because Minecraft 26.3 is shipped unobfuscated.
    maven { url = uri('localrepo') }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Minecraft 26.3 ships with official (unobfuscated) names, so an identity mapping
    // is enough: Loom detects the unobfuscated client automatically and the sources
    // compile directly against the official names.
    mappings "com.elowen:identity:1.0"

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Libraries bundled by the original mod (META-INF/jars/*.jar), copied to libs/.
    implementation files(
            'libs/skija-shared-0.143.17.jar',
            'libs/skija-windows-x64-0.143.17.jar',
            'libs/types-0.2.0.jar'
    )
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs << '-Xmaxerrs' << '10000'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
